  # ---------------- 管理员认证 ----------------
  /admin/login:
    post:
      operationId: adminLogin
      tags: [认证]
      summary: 管理员登录（限流 5次/60秒；需先调 GET /captcha）
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Client-Fingerprint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password, captcha_id, captcha_code]
              properties:
                username: { type: string, example: admin }
                password: { type: string, format: password, example: "admin123" }
                captcha_id:
                  type: string
                  description: "GET /captcha 返回的 captcha_id"
                  example: "captcha_65f1c2d4e8b9a01234567890abcdef12"
                captcha_code:
                  type: string
                  description: "用户输入的验证码字符"
                  example: "a3b9"
            example:
              username: admin
              password: "admin123"
              captcha_id: "captcha_65f1c2d4e8b9a01234567890abcdef12"
              captcha_code: "a3b9"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
              example:
                success: true
                code: 0
                msg: "登录成功"
                data:
                  token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  expires_in: 3600
                  user:
                    snow_id: 189000000000001
                    username: admin
                    nickname: "超级管理员"
                    avatar: ""
                    status: 1
                    roles: [super-admin]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '1008': { $ref: '#/components/responses/CaptchaInvalid' }

  /admin/refresh:
    post:
      operationId: adminRefresh
      tags: [认证]
      summary: 刷新管理员 token
      security: []
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          expires_in: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [认证]
      summary: 管理员登出
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

