        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/recycle-bin/{resource}/{id}/restore:
    put:
      operationId: adminRecycleBinRestore
      tags: [回收站]
      summary: 单条恢复
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [products, users, admins, admin_menus, roles, messages, user_favorites]
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: "记录 snow_id" }
        - $ref: '#/components/parameters/X-Idempotency-Key'
      responses:
        '200':
          description: 恢复成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/recycle-bin/{resource}/restore-batch:
    put:
      operationId: adminRecycleBinRestoreBatch
      tags: [回收站]
      summary: 批量恢复（ids=snow_id 列表）
      parameters:
        - name: resource
          in: path
          required: true
          schema:
            type: string
            enum: [products, users, admins, admin_menus, roles, messages, user_favorites]
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer, format: int64 }
                  example: [189000000000001, 189000000000002]
      responses:
        '200':
          description: 批量恢复成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------- 限流规则（后台动态配置，#65-68） ----------------
  /admin/rate-limit-rules:
    get:
      operationId: adminRateLimitRuleIndex
      tags: [限流规则]
      summary: 限流规则分页
      description: >-
        列出 `rate_limit_rules` 表全部规则；运行时中间件按
        `rule_key == routeName → rule_key == path → api:global/admin:global`
        顺序匹配，无匹配兜底 60/60。
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - { name: rule_key, in: query, schema: { type: string }, description: "按 rule_key 模糊过滤" }
      responses:
        '200':
          description: 规则分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApiResponseData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminRateLimitRuleStore
      tags: [限流规则]
      summary: 新增限流规则（写后清 Redis `rate_limit:rules` 缓存，多实例即时生效）
      parameters:
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RateLimitRuleInput' }
            example:
              rule_key: "login"
              max_attempts: 5
              decay_seconds: 60
              enabled: 1
              remark: "登录防爆破"
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /admin/rate-limit-rules/{id}:
    put:
      operationId: adminRateLimitRuleUpdate
      tags: [限流规则]
      summary: 修改限流规则（次数/时长/启停；写后清缓存）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_key: { type: string }
                max_attempts: { type: integer, minimum: 1 }
                decay_seconds: { type: integer, minimum: 1 }
                enabled: { type: integer, enum: [0,1] }
                remark: { type: string }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
    delete:
      operationId: adminRateLimitRuleDestroy
      tags: [限流规则]
      summary: 删除限流规则（写后清缓存；被删规则回退兜底 60/60 或更具体的上级规则）
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

# =============================================================================
# components
# =============================================================================
components:

  # ---------------- 安全方案 ----------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >-
        JWT Bearer Token。C 端用户与管理员均使用本 scheme；
        守卫由路由中间件（auth:api / auth:admin-api）区分，
        JWT payload 内含 `guard` 字段，跨守卫访问一律 401。

  # ---------------- 通用参数 ----------------
  parameters:
    X-Client-Fingerprint:
      name: X-Client-Fingerprint
      in: header
      required: false
      description: 浏览器指纹，用于复合限流；缺失时降级仅按 IP 限流。
      schema: { type: string, example: "fp_9f1c2d4e" }

    X-Idempotency-Key:
      name: X-Idempotency-Key
      in: header
      required: false
      description: >-
        幂等键（建议 UUID v4）。POST/PUT/DELETE 写接口携带后，
        相同 key 在 TTL（默认 600s）内重复请求将直接返回首次结果，
        不重复执行业务；缺失则放行。
      schema: { type: string, example: "b3c9d8a2-1f4e-4a7b-9c2d-8e7f6a5b4c3d" }

    Accept-Language:
      name: Accept-Language
      in: header
      required: false
      description: 语言偏好，支持 zh-CN / en；非法值回退 zh-CN。
      schema: { type: string, enum: [zh-CN, en], default: zh-CN }

    Skip-Desensitize:
      name: Skip-Desensitize
      in: header
      required: false
      description: >-
        设为 `1` 时跳过响应脱敏（mobile/id_card 返回原始明文），
        仅管理员特权场景使用。
      schema: { type: string, enum: ["0", "1"], default: "0" }

    page:
      name: page
      in: query
      required: false
      description: 页码，从 1 开始。
      schema: { type: integer, minimum: 1, default: 1 }

    page_size:
      name: page_size
      in: query
      required: false
      description: 每页条数，默认 15，最大 100（超限自动钳制）。
      schema: { type: integer, minimum: 1, maximum: 100, default: 15 }

  # ---------------- Schemas ----------------
  schemas:

    ApiResponse:
      type: object
      description: 统一响应结构（message() 助手输出）
      required: [success, code, msg, data]
      properties:
        success: { type: boolean, example: true, description: "code===0 时为 true，否则 false" }
        code:
          type: integer
          description: >-
            业务码（HTTP 状态恒为 200）：
            0=成功；1=通用失败；
            1001=参数错误；1002=未认证；1003=无权限；1004=不存在；
            1005=校验失败；1006=限流；1007=冲突/重复提交；
            1008=验证码错误/过期；
            5000=服务器内部错误；2xxxx=业务自定义码。
          example: 0
        msg: { type: string, description: "提示文案（已按 Accept-Language 翻译）", example: "操作成功" }
        data:
          description: "业务数据；失败时一般为 null，1005 时为字段错误明细对象"
          nullable: true
      example:
        success: true
        code: 0
        msg: "操作成功"
        data: null

    ApiResponseData:
      type: object
      description: 分页 data 结构
      required: [list, total, page, page_size]
      properties:
        list:
          type: array
          items: { type: object }
        total: { type: integer, example: 42 }
        page: { type: integer, example: 1 }
        page_size: { type: integer, example: 15 }

    LoginResult:
      type: object
      description: 登录成功返回 data
      required: [token, expires_in, user]
      properties:
        token: { type: string, description: "JWT access token" }
        expires_in: { type: integer, description: "过期秒数（=config('jwt.ttl')*60）", example: 3600 }
        user:
          type: object
          description: "当前登录用户/管理员简要信息"

    User:
      type: object
      properties:
        snow_id: { type: integer, format: int64, example: 189000000000001 }
        name: { type: string, example: "张三" }
        email: { type: string, format: email, example: "user@example.com" }
        status: { type: integer, enum: [0,1], description: "1启用 0禁用" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Admin:
      type: object
      properties:
        snow_id: { type: integer, format: int64, example: 189000000000001 }
        username: { type: string, example: "admin" }
        nickname: { type: string, example: "超级管理员" }
        email: { type: string, format: email }
        avatar: { type: string, format: uri, nullable: true }
        status: { type: integer, enum: [0,1] }
        roles:
          type: array
          items: { $ref: '#/components/schemas/Role' }
        created_at: { type: string, format: date-time }

    Role:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        name: { type: string, example: "运营" }
        code: { type: string, example: "operator" }
        remark: { type: string, nullable: true }
        permissions:
          type: array
          items: { $ref: '#/components/schemas/Permission' }
        menus:
          type: array
          items: { $ref: '#/components/schemas/AdminMenu' }

    Permission:
      type: object
      description: 动作级权限（code = {resource}:{action}）
      properties:
        snow_id: { type: integer, format: int64 }
        name: { type: string, example: "商品列表" }
        code: { type: string, example: "admin:product:list" }
        group: { type: string, example: "product", description: "按资源/模块分组" }
        action:
          type: string
          maxLength: 50
          example: "list"
          description: "动作 list/create/update/delete 或自定义 export/audit/kick/cancel/approve/import 等"
        type:
          type: integer
          enum: [1, 2]
          example: 1
          description: "1=system 预置 / 2=custom 自定义（system 预置不可删除）"
        status: { type: integer, enum: [0,1], example: 1, description: "1启用 0禁用" }

    PermissionInput:
      type: object
      description: 新建/更新自定义动作权限入参
      required: [name, code, action, group]
      properties:
        name: { type: string, example: "商品导出" }
        code: { type: string, example: "admin:product:export" }
        group: { type: string, example: "product" }
        action:
          type: string
          maxLength: 50
          example: "export"
        type:
          type: integer
          enum: [1, 2]
          default: 2
          description: "新建自定义权限默认 2=custom"
        status: { type: integer, enum: [0,1], default: 1 }

    AdminMenu:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        parent_id: { type: integer, example: 0 }
        title: { type: string, example: "商品管理" }
        path: { type: string, example: "/product" }
        component: { type: string, nullable: true, example: "product/index" }
        icon: { type: string, nullable: true }
        permission_code: { type: string, nullable: true, example: "admin:product:list" }
        sort: { type: integer, example: 1 }
        is_show: { type: boolean, example: true }
        is_cache: { type: boolean, example: true }
        is_external: { type: boolean, example: false }
        external_url: { type: string, nullable: true }
        children:
          type: array
          items: { $ref: '#/components/schemas/AdminMenu' }

    MenuInput:
      type: object
      required: [title, path]
      properties:
        parent_id: { type: integer, default: 0 }
        title: { type: string, example: "商品管理" }
        path: { type: string, example: "/product" }
        component: { type: string, nullable: true }
        icon: { type: string, nullable: true }
        permission_code: { type: string, nullable: true }
        sort: { type: integer, default: 0 }
        is_show: { type: boolean, default: true }
        is_cache: { type: boolean, default: true }
        is_external: { type: boolean, default: false }
        external_url: { type: string, nullable: true }

    Product:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        name: { type: string, example: "示例商品" }
        desc: { type: string, nullable: true }
        price: { type: number, format: float, example: 99.50 }
        status: { type: integer, enum: [0,1], description: "1上架 0下架" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductInput:
      type: object
      required: [name, price]
      properties:
        name: { type: string, example: "示例商品" }
        desc: { type: string }
        price: { type: number, format: float, example: 99.50 }
        status: { type: integer, enum: [0,1], default: 1 }

    Dict:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        type: { type: string, example: "product_status" }
        label: { type: string, example: "上架" }
        value: { type: string, example: "1" }
        sort: { type: integer, example: 1 }
        status: { type: integer, enum: [0,1] }

    DictInput:
      type: object
      required: [type, label, value]
      properties:
        type: { type: string, example: "product_status" }
        label: { type: string, example: "上架" }
        value: { type: string, example: "1" }
        sort: { type: integer, default: 0 }
        status: { type: integer, enum: [0,1], default: 1 }

    Message:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        receiver_type: { type: string, enum: [user, admin, all_user, all_admin] }
        receiver_id: { type: integer, format: int64, nullable: true }
        msg_type: { type: string, enum: [announce, biz, warn] }
        title: { type: string }
        content: { type: string }
        extra: { type: object, nullable: true }
        is_read: { type: boolean, example: false }
        is_pop: { type: boolean, example: false }
        created_at: { type: string, format: date-time }

    Favorite:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        user_id: { type: integer, format: int64, description: "C 端用户 snow_id" }
        product_id: { type: integer, format: int64, description: "商品 snow_id" }
        product: { $ref: '#/components/schemas/Product' }
        created_at: { type: string, format: date-time }

    IpBlacklist:
      type: object
      properties:
        snow_id: { type: integer, format: int64 }
        ip: { type: string, example: "203.0.113.66" }
        remark: { type: string, nullable: true }
        expire_at: { type: string, format: date-time, nullable: true, description: "null=永久封禁" }
        created_at: { type: string, format: date-time }

    AdminOperationLog:
      type: object
      description: >-
        审计日志条目（驱动化存储：默认 file JSON 行
        `storage/logs/audit/audit-YYYY-MM-DD.log`，可选 Elasticsearch 索引
        `audit_logs-YYYY.MM.DD`；**不落 MySQL**，见文档顶部注释 9）。
        字段与原 admin_operation_logs 表保持一致，仅作数据结构参考。
      properties:
        log_id:
          type: string
          description: "审计日志 ID（毫秒时间戳+随机串）"
          example: "1730000000123-ab12cd"
        admin_id: { type: integer, format: int64, nullable: true }
        url: { type: string }
        method: { type: string, example: "POST" }
        ip: { type: string }
        request_params: { type: string, nullable: true, description: "JSON 字符串，截断 2000 字符；密码字段已脱敏 ***" }
        response_result: { type: string, nullable: true, description: "JSON 字符串，截断 2000 字符" }
        cost_ms: { type: integer, nullable: true, example: 42 }
        is_high_risk: { type: boolean, description: "true=高危：改密码/改角色/踢用户等" }
        created_at: { type: string, format: date-time }

    RateLimitRule:
      type: object
      description: 后台动态限流规则（rate_limit_rules 表；写后清 Redis `rate_limit:rules` 缓存）
      properties:
        snow_id: { type: integer, format: int64 }
        rule_key:
          type: string
          example: "login"
          description: >-
            路由/分组标识，唯一。常见值：`api:global`、`admin:global`、
            `login`、`admin:login`、`product:list` 等。
        max_attempts: { type: integer, example: 60, description: "时间窗内最大请求次数" }
        decay_seconds: { type: integer, example: 60, description: "时间窗秒数" }
        enabled: { type: integer, enum: [0,1], default: 1, description: "1启用 0停用" }
        remark: { type: string, nullable: true, example: "登录防爆破" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RateLimitRuleInput:
      type: object
      description: 新建/更新限流规则入参
      required: [rule_key, max_attempts, decay_seconds]
      properties:
        rule_key: { type: string, example: "login" }
        max_attempts: { type: integer, minimum: 1, example: 5 }
        decay_seconds: { type: integer, minimum: 1, example: 60 }
        enabled: { type: integer, enum: [0,1], default: 1 }
        remark: { type: string }

    Error:
      type: object
      description: 统一错误响应结构（HTTP 状态恒为 200，业务码见 code）
      properties:
        success: { type: boolean, example: false }
        code: { type: integer, example: 1002, description: "业务码，见 ApiResponse.code 说明" }
        msg: { type: string, example: "未登录或登录已过期" }
        data:
          nullable: true
          description: "1005 时为字段错误明细对象；其余错误一般为 null"

  # ---------------- 通用错误响应 ----------------
  responses:

    BadRequest:
      description: 业务/参数错误（如回收站 resource 非法）——实际 HTTP 200，body.code=1001
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1001
            msg: "不支持的回收站资源"
            data: null

    Unauthorized:
      description: 未认证 / token 过期 / 跨守卫越权 / 账号被强制下线——实际 HTTP 200，body.code=1002
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1002
            msg: "未登录或登录已过期"
            data: null

    Forbidden:
      description: 无权限（RBAC 校验失败）或 IP 已被黑名单封禁——实际 HTTP 200，body.code=1003
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1003
            msg: "无权限访问"
            data: null

    NotFound:
      description: 资源不存在——实际 HTTP 200，body.code=1004
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1004
            msg: "数据不存在"
            data: null

    Conflict:
      description: 资源冲突（如重复收藏、幂等重复提交）——实际 HTTP 200，body.code=1007
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1007
            msg: "已收藏过该商品"
            data: null

    CaptchaInvalid:
      description: 验证码错误或过期——实际 HTTP 200，body.code=1008
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1008
            msg: "验证码错误或已过期"
            data: null

    UnprocessableEntity:
      description: 表单校验失败（data 为字段错误明细）——实际 HTTP 200，body.code=1005
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1005
            msg: "输入校验失败"
            data:
              email: ["The email field is required."]
              password: ["The password must be at least 6 characters."]

    TooManyRequests:
      description: 触发复合限流（IP + 用户ID + 浏览器指纹）——实际 HTTP 200，body.code=1006
      headers:
        X-RateLimit-Limit:
          schema: { type: integer, example: 60 }
        X-RateLimit-Remaining:
          schema: { type: integer, example: 0 }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1006
            msg: "请求过于频繁，请稍后再试"
            data: null

    PayloadTooLarge:
      description: 请求体超过 Nginx/PHP 限制（大表单 DOS 防护）——实际 HTTP 200，body.code=1
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 1
            msg: "请求体过大"
            data: null

    InternalError:
      description: 服务器内部错误（生产环境不暴露堆栈）——实际 HTTP 200，body.code=5000
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            success: false
            code: 5000
            msg: "服务器内部错误"
            data: null
