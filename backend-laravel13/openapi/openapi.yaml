# =============================================================================
# Laravel13 API Skeleton - OpenAPI 3.0.3 接口文档
# -----------------------------------------------------------------------------
# 全局约定说明：
#
# 1) Bearer 双守卫隔离：
#    - C 端普通用户使用 `Authorization: Bearer <token>`，对应守卫 `api`，
#      数据源 `users` 表；
#    - 管理员同样使用 `Authorization: Bearer <token>`，对应守卫 `admin-api`，
#      数据源 `admins` 表；
#    - JWT payload 携带 `guard` 字段；普通用户 token 不能访问 `/admin/*`，
#      管理员 token 不能访问 C 端受鉴权接口，跨守卫访问一律 401。
#
# 2) X-Idempotency-Key 幂等防重复提交：
#    - 仅 POST/PUT/DELETE 写接口生效；GET 直接跳过。
#    - 前端生成 UUID v4 放入请求头 `X-Idempotency-Key`；
#    - Redis 缓存上次响应，相同 key 在 TTL（默认 600s）内重复请求直接返回
#      缓存结果，不重复执行业务；
#    - key 缺失则放行（不强制）。
#
# 3) X-Client-Fingerprint 限流（后台动态配置）：
#    - 复合限流 key = composite_rate:{path}:{ip}:{uid_{id}|fp_{fingerprint}}；
#    - 已登录用户按守卫取 user_id / admin_id；游客使用浏览器指纹；
#    - 指纹缺失降级仅用 IP；
#    - 超限返回 429，并带响应头 X-RateLimit-Limit / X-RateLimit-Remaining。
#    - 【设计变更】api.composite.rate 中间件不再写死次数/时长，规则存
#      `rate_limit_rules` 表（GET/POST/PUT/DELETE /admin/rate-limit-rules），
#      后台可改 max_attempts/decay_seconds/enabled；写操作后清 Redis 缓存
#      `rate_limit:rules`（TTL 300s），多实例即时生效。无匹配规则兜底 60/60。
#      代码层 `api.composite.rate:10,60` 仍可作为覆盖能力保留（默认不用）。
#
# 4) Skip-Desensitize 跳过脱敏：
#    - 默认响应 data 中 mobile / id_card 等字段自动脱敏；
#    - 管理员导出等特权场景可加请求头 `Skip-Desensitize: 1` 跳过脱敏，
#      返回原始明文。
#
# 5) Accept-Language：
#    - 支持 `zh-CN` / `en`，非法输入回退 `zh-CN`；也可通过 query `?lang=` 指定。
#
# 6) 分页：入参 `page`(默认1)、`page_size`(默认15，最大100)；
#    返回 data = { list, total, page, page_size }。
#
# 7) 对外 ID：所有路径参数 {id} 均为 snow_id（雪花业务 ID），自增主键 id 已隐藏。
#
# 8) 动作级权限（RBAC）：
#    - 权限 code 约定 `{resource}:{action}`，四基本动作 list/create/update/delete
#      （查/增/改/删），自定义动作不限（export/audit/kick/cancel/approve/import 等），
#      后台可按资源勾选增删改查与自定义动作（POST/PUT/DELETE /admin/permissions）；
#    - AdminPermission 中间件按精确 code 校验，"能查"不代表能"改/删"，
#      一个接口对应一个精确权限 code；
#    - permissions 表含 `action`(varchar50) 与 `type`(1=system 预置 / 2=custom 自定义)。
#
# 9) 审计日志驱动化存储（设计变更：审计不落 MySQL）：
#    - 管理员操作日志为海量 append-only 数据，**不写 MySQL**（不建
#      admin_operation_logs 表）；
#    - 默认驱动 file：写 `storage/logs/audit/audit-YYYY-MM-DD.log`（JSON 行），
#      含 log_id/admin_id/url/method/ip/request_params/response_result/cost_ms/
#      is_high_risk/created_at；
#    - 可选驱动 elasticsearch：Guzzle `_bulk` 写索引 `audit_logs-YYYY.MM.DD`，
#      通过 `AUDIT_LOG_DRIVER=file|elasticsearch` 切换，ES 不可达自动回退 file；
#    - 读取由 `OperationLogService::read()` 提供（分页 + admin_id/日期过滤），
#      文件驱动按 created_at 倒序解析当日与历史文件；
#    - 保留策略：file 按 retention_days（默认 90）由 schedule 每日清理。
#
# 10) 统一状态码体系（HTTP 一律 200 + body.code）：
#    - 所有响应 HTTP 状态码恒为 200（含错误）；前端按 body.code 判断业务结果。
#    - code 约定：
#        0      成功
#        1      通用业务失败
#        1001   参数错误
#        1002   未认证 / token 过期 / 跨守卫越权 / 被踢下线
#        1003   无权限（RBAC 校验失败）/ IP 黑名单
#        1004   资源不存在
#        1005   表单校验失败（data 为字段错误明细）
#        1006   限流（429 语义）
#        1007   冲突 / 重复提交（含幂等命中、重复收藏）
#        1008   验证码错误 / 过期（登录接口）
#        5000   服务器内部错误（不暴露堆栈）
#        2xxxx  业务自定义码（如 2001 商品下架、2002 库存不足等）
#    - success: code===0 时为 true，否则 false。
#    - 本文档 components.responses 下的 Unauthorized/Forbidden/NotFound 等键
#      仅为 OpenAPI 文档分组用途，**实际 HTTP 状态均为 200**，
#      响应体中的 code 字段才是真实业务码。
# =============================================================================
openapi: 3.0.3

info:
  title: Laravel13 API Skeleton
  version: 1.0.0
  description: >-
    生产级 Laravel 13 API 骨架接口文档。
    双表 JWT 认证（C 端 users / 后台 admins）、RBAC 权限、动态菜单、
    多端登录管控、Reverb WebSocket 站内消息、复合限流、幂等防重、
    响应脱敏、IP 黑名单、回收站软删除恢复、操作审计日志、健康检查。
    统一响应结构：{ success, code, msg, data }。

servers:
  - url: http://localhost:8000/api
    description: local

tags:
  - name: 健康检查
    description: DB / Redis 连通性探测
  - name: 认证
    description: C 端 / 管理员 登录、登出、刷新
  - name: C端用户
    description: 普通用户个人中心
  - name: 商品
    description: 商品只读（C 端）/ 全量 CRUD（管理员）
  - name: 字典
    description: 通用数据字典
  - name: 消息
    description: Reverb WebSocket 站内消息
  - name: 收藏
    description: 用户商品收藏（扩展示例）
  - name: 管理员
    description: 管理员自身与管理员账号管理
  - name: 角色
    description: RBAC 角色管理
  - name: 权限
    description: 权限码全表
  - name: 菜单
    description: 后台动态菜单树
  - name: 用户管理
    description: 管理员侧管理 C 端普通用户、在线终端、踢下线
  - name: IP黑名单
    description: 恶意 IP 封禁与解除
  - name: 回收站
    description: 软删除数据查询与恢复
  - name: 操作日志
    description: 管理员行为审计日志（驱动化存储，不落 MySQL，见文档顶部注释 9）
  - name: 限流规则
    description: 后台动态限流规则配置（次数/时长/启停，见文档顶部注释 3）
  - name: 多语言
    description: i18n 语言包下发与后台管理（公开读 + 管理员维护）

# =============================================================================
# 全局通用安全：所有受保护接口统一使用 Bearer JWT。
# =============================================================================
security:
  - bearerAuth: []

# =============================================================================
# paths
# =============================================================================
paths:

  # ---------------- 健康检查 ----------------
  /health:
    get:
      operationId: healthIndex
      tags: [健康检查]
      summary: DB + Redis 连通性检查
      security: []
      responses:
        '200':
          description: 服务正常
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                success: true
                code: 0
                msg: "服务正常"
                data:
                  db: ok
                  redis: ok

  # ---------------- 多语言（公开读） ----------------
  /locale/{lang}:
    get:
      operationId: publicLocaleShow
      tags: [多语言]
      summary: 拉取指定语言包（data={lang, md5, items:{key:value}}）
      description: >-
        前端启动时调用：先调 `/locale/{lang}/meta` 比对 md5，未变则用本地缓存；
        变化则整包拉取。lang 支持 `zh-CN` / `en`，非法值返回 code=1004。
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          description: 语言标识（zh-CN / en）；也可选填（路径 {lang?}），缺省用 Accept-Language 或回退 zh-CN
          schema:
            type: string
            enum: [zh-CN, en]
      responses:
        '200':
          description: 语言包；非法 lang 返回 HTTP 200 + body.code=1004
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lang: { type: string, example: "zh-CN" }
                          md5: { type: string, example: "d41d8cd98f00b204e9800998ecf8427e" }
                          items:
                            type: object
                            additionalProperties: { type: string }
                            example:
                              success: "操作成功"
                              fail: "操作失败"
                              login.success: "登录成功"
              example:
                success: true
                code: 0
                msg: "操作成功"
                data:
                  lang: "zh-CN"
                  md5: "9e107d9d372bb6826bd81d3542a419d6"
                  items:
                    success: "操作成功"
                    fail: "操作失败"
                    login.success: "登录成功"

  /locale/{lang}/meta:
    get:
      operationId: publicLocaleMeta
      tags: [多语言]
      summary: 语言包轻量元信息（仅 lang + md5，用于前端缓存比对）
      security: []
      parameters:
        - name: lang
          in: path
          required: true
          schema:
            type: string
            enum: [zh-CN, en]
      responses:
        '200':
          description: 元信息；非法 lang 返回 HTTP 200 + body.code=1004
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lang: { type: string, example: "zh-CN" }
                          md5: { type: string, example: "9e107d9d372bb6826bd81d3542a419d6" }

  # ---------------- 验证码 ----------------
  /captcha:
    get:
      operationId: publicCaptcha
      tags: [认证]
      summary: 获取图形验证码（登录前调用；data.captcha_id 随登录请求回传）
      security: []
      responses:
        '200':
          description: 验证码
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        required: [captcha_id, image]
                        properties:
                          captcha_id:
                            type: string
                            example: "captcha_65f1c2d4e8b9a01234567890abcdef12"
                            description: "验证码唯一 ID（Redis 存储，TTL 5 分钟）"
                          image:
                            type: string
                            format: uri
                            example: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."
                            description: "data:image/png;base64 编码的图片，前端直接 <img src> 渲染"
              example:
                success: true
                code: 0
                msg: "操作成功"
                data:
                  captcha_id: "captcha_65f1c2d4e8b9a01234567890abcdef12"
                  image: "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA..."

  # ---------------- C 端认证 ----------------
  /login:
    post:
      operationId: userLogin
      tags: [认证]
      summary: C 端普通用户登录（限流 5次/60秒；需先调 GET /captcha）
      security: []
      parameters:
        - $ref: '#/components/parameters/X-Client-Fingerprint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, captcha_id, captcha_code]
              properties:
                email: { type: string, format: email, example: user@example.com }
                password: { type: string, format: password, example: "password123" }
                captcha_id:
                  type: string
                  description: "GET /captcha 返回的 captcha_id"
                  example: "captcha_65f1c2d4e8b9a01234567890abcdef12"
                captcha_code:
                  type: string
                  description: "用户输入的验证码字符"
                  example: "a3b9"
            example:
              email: user@example.com
              password: "password123"
              captcha_id: "captcha_65f1c2d4e8b9a01234567890abcdef12"
              captcha_code: "a3b9"
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/LoginResult' }
              example:
                success: true
                code: 0
                msg: "登录成功"
                data:
                  token: "eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9..."
                  expires_in: 3600
                  user:
                    snow_id: 189000000000001
                    name: "张三"
                    email: "user@example.com"
                    status: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '1008': { $ref: '#/components/responses/CaptchaInvalid' }

  /refresh:
    post:
      operationId: userRefresh
      tags: [认证]
      summary: 刷新 C 端 token（旧 token 自动进黑名单）
      security: []
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          token: { type: string }
                          expires_in: { type: integer, example: 3600 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /logout:
    post:
      operationId: userLogout
      tags: [认证]
      summary: C 端登出（当前 token 进黑名单，并移出在线设备集合）
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example:
                success: true
                code: 0
                msg: "退出登录成功"
                data: null
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- C 端个人中心 ----------------
  /me:
    get:
      operationId: userProfile
      tags: [C端用户]
      summary: 当前登录用户个人信息（响应脱敏）
      responses:
        '200':
          description: 个人信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      operationId: userUpdateProfile
      tags: [C端用户]
      summary: 更新个人资料（name / email）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, example: "张三" }
                email: { type: string, format: email, example: "new@example.com" }
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  /me/password:
    put:
      operationId: userChangePassword
      tags: [C端用户]
      summary: 修改当前用户密码（幂等）
      parameters:
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, password, password_confirmation]
              properties:
                old_password: { type: string, format: password, example: "old123" }
                password: { type: string, format: password, example: "new12345" }
                password_confirmation: { type: string, format: password, example: "new12345" }
      responses:
        '200':
          description: 修改成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

  # ---------------- C 端商品只读 ----------------
  /products:
    get:
      operationId: userProductList
      tags: [商品]
      summary: C 端商品分页列表（只读）
      security: []
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - { name: status, in: query, schema: { type: integer, enum: [0,1] }, description: "上下架状态过滤" }
      responses:
        '200':
          description: 商品分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApiResponseData' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /products/{id}:
    get:
      operationId: userProductShow
      tags: [商品]
      summary: C 端商品详情（{id}=snow_id）
      security: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 商品详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Product' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- C 端字典只读 ----------------
  /dicts/{type}:
    get:
      operationId: userDictShow
      tags: [字典]
      summary: 按 type 获取字典选项（Redis 缓存）
      security: []
      parameters:
        - { name: type, in: path, required: true, schema: { type: string }, example: "product_status" }
      responses:
        '200':
          description: 字典项列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Dict' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------- C 端消息 ----------------
  /messages:
    get:
      operationId: userMessageIndex
      tags: [消息]
      summary: 我的消息分页
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - { name: is_read, in: query, schema: { type: integer, enum: [0,1] } }
      responses:
        '200':
          description: 消息分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApiResponseData' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/unread-count:
    get:
      operationId: userMessageUnreadCount
      tags: [消息]
      summary: 未读消息数
      responses:
        '200':
          description: 未读数
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          unread_count: { type: integer, example: 3 }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /messages/read/{id}:
    put:
      operationId: userMessageMarkRead
      tags: [消息]
      summary: 标记单条消息已读
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 }, description: "消息 snow_id" }
      responses:
        '200':
          description: 已标记
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /messages/read-all:
    put:
      operationId: userMessageMarkAllRead
      tags: [消息]
      summary: 全部已读
      responses:
        '200':
          description: 全部已读
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------- C 端收藏 ----------------
  /favorites:
    post:
      operationId: userFavoriteStore
      tags: [收藏]
      summary: 收藏商品（幂等；重复收藏返回 409）
      parameters:
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id]
              properties:
                product_id: { type: integer, format: int64, example: 189000000000100 }
      responses:
        '201':
          description: 收藏成功
          content:
