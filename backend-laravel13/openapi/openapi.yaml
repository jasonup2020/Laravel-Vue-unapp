  # ---------------- 管理员消息 ----------------
  /admin/messages:
    get:
      operationId: adminMessageIndex
      tags: [消息]
      summary: 消息分页（含筛选）
      parameters:
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/page_size'
        - { name: receiver_type, in: query, schema: { type: string, enum: [user, admin, all_user, all_admin] } }
        - { name: msg_type, in: query, schema: { type: string, enum: [announce, biz, warn] } }
      responses:
        '200':
          description: 消息分页
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/ApiResponseData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminMessageSend
      tags: [消息]
      summary: 发送站内消息（定向用户/管理员 / 系统公告；Reverb 实时推送）
      parameters:
        - $ref: '#/components/parameters/X-Idempotency-Key'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [receiver_type, msg_type, title, content]
              properties:
                receiver_type:
                  type: string
                  enum: [user, admin, all_user, all_admin]
                  example: user
                receiver_id:
                  type: integer
                  format: int64
                  description: "接收人 snow_id；广播场景为 null"
                  example: 189000000000123
                msg_type:
                  type: string
                  enum: [announce, biz, warn]
                  example: biz
                title: { type: string, example: "订单已发货" }
                content: { type: string, example: "您的订单 #12345 已发货，预计 2 天送达。" }
                extra:
                  type: object
                  description: "扩展参数（跳转 url、业务 id 等）"
                  example: { url: "/order/12345", order_id: 12345 }
                is_pop: { type: boolean, example: false }
            example:
              receiver_type: user
              receiver_id: 189000000000123
              msg_type: biz
              title: "订单已发货"
              content: "您的订单 #12345 已发货。"
              extra: { url: "/order/12345", order_id: 12345 }
              is_pop: false
      responses:
        '201':
          description: 发送成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example:
                success: true
                code: 0
                msg: "消息发送成功"
                data: { snow_id: 189000000000501, receiver_type: user, receiver_id: 189000000000123 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

