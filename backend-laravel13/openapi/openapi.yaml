  # ---------------- 多语言（管理员维护） ----------------
  /admin/locale/languages:
    get:
      operationId: adminLocaleLanguages
      tags: [多语言]
      summary: 列出全部可用语言（data.languages=[{lang,name,md5,updated_at}]）
      description: 权限 `admin:i18n:list`
      responses:
        '200':
          description: 语言列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          languages:
                            type: array
                            items:
                              type: object
                              properties:
                                lang: { type: string, example: "zh-CN" }
                                name: { type: string, example: "简体中文" }
                                md5: { type: string }
                                updated_at: { type: string, format: date-time }
              example:
                success: true
                code: 0
                msg: "操作成功"
                data:
                  languages:
                    - { lang: "zh-CN", name: "简体中文", md5: "9e107d9d372bb6826bd81d3542a419d6", updated_at: "2026-10-27T10:00:00+08:00" }
                    - { lang: "en", name: "English", md5: "a1b2c3d4e5f6...", updated_at: "2026-10-27T10:00:00+08:00" }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/locale/refresh:
    post:
      operationId: adminLocaleRefresh
      tags: [多语言]
      summary: 刷新语言包缓存（可选 body.lang 指定单个，不带则清全部）
      description: 权限 `admin:i18n:refresh`
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                lang: { type: string, enum: [zh-CN, en] }
            example:
              lang: "zh-CN"
      responses:
        '200':
          description: 刷新成功
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiResponse' }
              example:
                success: true
                code: 0
                msg: "操作成功"
                data: { cleared: ["zh-CN"] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/locale/{lang}:
    get:
      operationId: adminLocaleShow
      tags: [多语言]
      summary: 查看指定语言包全量（含 md5 + items）
      description: 权限 `admin:i18n:list`
      parameters:
        - name: lang
          in: path
          required: true
          schema: { type: string, enum: [zh-CN, en] }
      responses:
        '200':
          description: 语言包
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lang: { type: string }
                          md5: { type: string }
                          items:
                            type: object
                            additionalProperties: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: adminLocaleUpdate
      tags: [多语言]
      summary: 覆盖更新语言包 items（仅覆盖已存在 key；新增 key 被跳过，返回 data.skipped）
      description: 权限 `admin:i18n:update`；写后清该语言缓存并重算 md5。
      parameters:
        - name: lang
          in: path
          required: true
          schema: { type: string, enum: [zh-CN, en] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: object
                  additionalProperties: { type: string }
              example:
                items:
                  success: "操作成功（已更新）"
                  login.success: "登录成功（已更新）"
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          lang: { type: string }
                          md5: { type: string }
                          updated:
                            type: integer
                            example: 2
                            description: "实际更新的 key 数量"
                          skipped:
                            type: array
                            items: { type: string }
                            example: ["new.key.never.existed"]
                            description: "被跳过的 key（不存在于原语言包）"
              example:
                success: true
                code: 0
                msg: "操作成功"
                data:
                  lang: "zh-CN"
                  md5: "newmd5hash..."
                  updated: 2
                  skipped: ["new.key.never.existed"]
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }

